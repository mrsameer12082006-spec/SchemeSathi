services:
  # SchemeSathi FastAPI Backend
  - type: web
    name: schemesathi-backend
    env: python
    rootDir: schemesathi-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        value: https://yywtrgwhemfwywfnwmxf.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_hBj_1ALXEzUorlS28aXOPg_AXM-b_xx
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
      - key: SARVAM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  # SchemeSathi Vite React Frontend (Static Site)
  - type: web
    name: schemesathi-frontend
    env: static
    rootDir: schemesathi-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: schemesathi-backend
          property: host
      - key: VITE_SUPABASE_URL
        value: https://yywtrgwhemfwywfnwmxf.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_hBj_1ALXEzUorlS28aXOPg_AXM-b_xx
